name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      SDL_AUDIODRIVER: dummy
      REQUIRE_GUI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tk
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - if: runner.os == 'Windows'
        run: python -m unittest discover -v
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -v
      - run: python tools/create_sounds.py
      - run: git diff --exit-code -- assets/sounds
